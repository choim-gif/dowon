<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다원HR 마케팅 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{ --bg:#F2F4F6; --card:#FFFFFF; --ink:#191F28; --faint:#8B95A1; --blue:#3182F6; --line:#E5E8EB; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{display:flex;flex-direction:column;font-family:'Pretendard',-apple-system,system-ui,'Malgun Gothic',sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  .tabbar{display:flex;align-items:center;gap:8px;padding:12px 18px;background:var(--card);
    border-bottom:1px solid var(--line);flex-shrink:0;flex-wrap:wrap;box-shadow:0 1px 6px rgba(0,0,0,.03)}
  .brand{font-weight:800;font-size:16px;margin-right:6px;letter-spacing:-.3px}
  .brand span{color:var(--blue)}
  .tab{border:none;background:var(--bg);color:var(--faint);font-family:inherit;font-weight:700;font-size:15px;
    padding:10px 20px;border-radius:12px;cursor:pointer;transition:.12s}
  .tab:hover{background:#E9ECF0}
  .tab.on{background:var(--blue);color:#fff}
  .tab:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .frames{flex:1;position:relative;min-height:0}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:var(--bg)}
  iframe.hidden{display:none}
</style>
</head>
<body>
  <div class="tabbar">
    <div class="brand">도원 <span>마케팅</span></div>
    <button class="tab on" data-t="okr">🎯 OKR 대시보드</button>
    <button class="tab" data-t="prio">✅ 우선순위 실행리스트</button>
    <button class="tab" data-t="flow">📈 유입경로</button>
  </div>
  <div class="frames">
    <iframe data-t="okr"  id="f-okr"  src="okr.html" title="OKR 대시보드"></iframe>
    <iframe data-t="prio" id="f-prio" class="hidden" src="priority.html" title="우선순위 실행리스트" loading="lazy"></iframe>
    <!-- 유입경로는 라이트 전용인 이 껍데기에 맞춰 테마를 고정합니다 -->
    <iframe data-t="flow" id="f-flow" class="hidden" src="flow.html?theme=light" title="유입경로" loading="lazy"></iframe>
  </div>
<script>
  const tabs   = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  const frames = Array.prototype.slice.call(document.querySelectorAll('.frames iframe'));

  function show(t){
    tabs.forEach(function(b){ b.classList.toggle('on', b.dataset.t === t); });
    frames.forEach(function(f){ f.classList.toggle('hidden', f.dataset.t !== t); });
    // 새로고침해도 보던 탭이 유지되고, 주소를 그대로 공유할 수 있습니다
    try { history.replaceState(null, '', '?tab=' + t); } catch (e) {}
  }

  tabs.forEach(function(b){
    b.addEventListener('click', function(){ show(b.dataset.t); });
  });

  // ?tab=flow 처럼 특정 탭으로 바로 열 수 있습니다
  var want = new URLSearchParams(location.search).get('tab');
  if (want && tabs.some(function(b){ return b.dataset.t === want; })) show(want);
</script>
</body>
</html>
