<!-- ============================================================
     도원 케이스 페이지 16개 — 아임웹 iframe embed 코드

     ⚠️ 중요: 각 아임웹 페이지에는 「해당 케이스 1개 블록만」 복사·붙여넣기
     ⚠️ 한 페이지에 여러 케이스가 나오면, 여러 블록을 다 붙여넣은 것입니다

     사용법:
     1. 아래에서 원하는 케이스의 블록을 찾기 (iframe + script 둘 다 포함)
     2. 그 블록 통째로 복사
     3. 아임웹 「HTML 입력」 위젯 하나에 붙여넣기
     4. 저장

     ※ script 블록은 가드 처리돼서 페이지에 중복돼도 1번만 실행됩니다
     ============================================================ -->


<!-- ========== [case-1] 찾아드림 — 환급 가능성 확인 ========== -->
<iframe class="dw-iframe" src="https://choim-gif.github.io/dowon/case-1.html" width="100%" height="2000" frameborder="0" scrolling="no" style="display:block;border:none;width:100%;" title="찾아드림 — 1분 환급 가능성 확인"></iframe>
<script>(function(){if(window.__dwIframeListenerSet)return;window.__dwIframeListenerSet=true;window.addEventListener('message',function(e){if(!e.data||e.data.type!=='dw-iframe-resize')return;var ifs=document.querySelectorAll('iframe.dw-iframe');for(var i=0;i<ifs.length;i++){if(ifs[i].contentWindow===e.source){ifs[i].style.height=(e.data.height+20)+'px';break;}}});})();</script>
